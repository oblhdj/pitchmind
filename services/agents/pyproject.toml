[project]
name = "pitchmind-agents"
version = "0.1.0"
description = "Multi-agent insight generation for PitchMind (Microsoft Agent Framework + Foundry)"
requires-python = ">=3.12"
dependencies = [
    "pitchmind-contracts",
    "agent-framework-core>=1.23,<2",
    "agent-framework-foundry>=1.15,<2",
    "azure-identity>=1.19",
    "azure-monitor-opentelemetry>=1.8.10,<2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pitchmind_agents"]
