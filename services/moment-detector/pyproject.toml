[project]
name = "pitchmind-moments"
version = "0.1.0"
description = "Moment detection with evidence for PitchMind"
requires-python = ">=3.12"
dependencies = ["pitchmind-contracts", "pitchmind-football", "pitchmind-stats"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pitchmind_moments"]
