[project]
name = "pitchmind-render"
version = "0.1.0"
description = "Insights to timed broadcast overlays for PitchMind"
requires-python = ">=3.12"
dependencies = ["pitchmind-contracts"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pitchmind_render"]
