[project]
name = "pitchmind-contracts"
version = "1.0.0"
description = "Shared data contracts for PitchMind services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pitchmind_contracts"]
