[project]
name = "pitchmind-bus"
version = "0.1.0"
description = "Publish/subscribe bus for PitchMind services (in-memory locally, Azure Event Hubs in the cloud)"
requires-python = ">=3.12"
dependencies = ["pitchmind-contracts"]

[project.optional-dependencies]
eventhubs = ["azure-eventhub>=5.11,<6", "azure-identity>=1.19", "aiohttp>=3.9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pitchmind_bus"]
