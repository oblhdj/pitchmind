[project]
name = "pitchmind-football"
version = "0.1.0"
description = "Pitch geometry and football models (xG, xT, pass difficulty) shared by PitchMind services"
requires-python = ">=3.12"
dependencies = ["pitchmind-contracts"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pitchmind_football"]
